version: "3"

tasks:
  adr:new:
    desc: Create a new ADR interactively (usage - task adr:new -- "Short decision title")
    interactive: true
    cmds:
      - pnpm exec log4brains adr new {{.CLI_ARGS}}

  adr:preview:
    desc: Browse the ADR knowledge base locally with hot reload (http://localhost:4004)
    cmds:
      - pnpm exec log4brains preview {{.CLI_ARGS}}

  build:
    cmds:
      - pnpm run build

  clear-rr-cache:
    cmds:
      - rm -rf .git/rr-cache

  db:current:
    desc: Show the current DB (credentials masked)
    silent: true
    preconditions:
      - sh: '[ -n "${MY_APP_DATABASE_URL}" ]'
        msg: "MY_APP_DATABASE_URL is not set"
    cmds:
      - printf '%s\n' "MY_APP_DATABASE_URL=${MY_APP_DATABASE_URL}" | sed -E 's#://[^@/]*@#://***@#'

  dev:
    preconditions:
      - sh: which jq
        msg: Missing "jq" command-line utility.
    env:
      SOME_PREFIX_LATEST_VERSION:
        sh: jq -r .version ../desktop/package.json
    cmds:
      - pnpm run dev

  format:
    desc: Format all files
    cmds:
      - pnpm run format

  format:changed:
    desc: Format only Git changed files
    cmds:
      - "{ git diff --relative --name-only --diff-filter=ACMR; git diff --staged --relative --name-only --diff-filter=ACMR; git ls-files --others --exclude-standard; } | sort -u | xargs -r pnpm exec prettier --write --ignore-unknown"

  format:check:
    desc: Check files formatting
    cmds:
      - pnpm run format:check

  install:
    cmds:
      - pnpm install

  start:
    env:
      SOME_PREFIX_LATEST_VERSION:
        sh: jq -r .version ../desktop/package.json
    cmds:
      - pnpm run start

  use:env:
    internal: true
    silent: true
    preconditions:
      - sh: test -f shell.{{.ENV_NAME}}.nix
        msg: Missing "shell.{{.ENV_NAME}}.nix" file.
    cmds:
      - cp shell.{{.ENV_NAME}}.nix shell.nix
      # - direnv allow

  use:dev:
    cmds:
      - task: use:env
        vars:
          ENV_NAME: development

  use:prod:
    cmds:
      - task: use:env
        vars:
          ENV_NAME: production

  version:bump:
    desc: "Bump project version without committing (default: patch). E.g. task version:bump -- minor"
    cmds:
      - pnpm run version:bump {{.CLI_ARGS | default "patch"}}

