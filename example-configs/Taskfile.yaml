version: "3"

tasks:
  # ----------------------------------------------------------------------------
  # Meta
  # ----------------------------------------------------------------------------

  list:
    desc: List all tasks, including those without a description
    cmds:
      - task --list-all

  # ----------------------------------------------------------------------------
  # Setup
  # ----------------------------------------------------------------------------

  install:
    cmds:
      - pnpm install

  # ----------------------------------------------------------------------------
  # Development
  # ----------------------------------------------------------------------------

  build:
    cmds:
      - pnpm run build

  dev:
    preconditions:
      - sh: which jq
        msg: Missing "jq" command-line utility.
    env:
      MY_APP_LATEST_VERSION:
        sh: jq -r .version ../desktop/package.json
    cmds:
      - pnpm run dev

  start:
    env:
      MY_APP_LATEST_VERSION:
        sh: jq -r .version ../desktop/package.json
    cmds:
      - pnpm run start

  # ----------------------------------------------------------------------------
  # Formatting
  # ----------------------------------------------------------------------------

  format:
    desc: Format all files
    cmds:
      - pnpm run format

  format:changed:
    desc: Format only Git changed files
    cmds:
      - "{ git diff --relative --name-only --diff-filter=ACMR; git diff --staged --relative --name-only --diff-filter=ACMR; git ls-files --others --exclude-standard; } | sort -u | xargs -r pnpm exec prettier --write --ignore-unknown"

  format:check:
    desc: Check files formatting
    cmds:
      - pnpm run format:check

  # ----------------------------------------------------------------------------
  # Environment
  # ----------------------------------------------------------------------------

  use:env:
    internal: true
    silent: true
    preconditions:
      - sh: test -f shell.{{.ENV_NAME}}.nix
        msg: Missing "shell.{{.ENV_NAME}}.nix" file.
    cmds:
      - cp shell.{{.ENV_NAME}}.nix shell.nix
      # - direnv allow

  use:dev:
    cmds:
      - task: use:env
        vars:
          ENV_NAME: development

  use:prod:
    cmds:
      - task: use:env
        vars:
          ENV_NAME: production

  # Run before anything that touches shared resources to confirm the target,
  # since a stale shell.nix or shell would otherwise point at the wrong one.
  about:
    desc: Show which environment and DB the tasks will use (credentials masked)
    silent: true
    vars:
      # shell.nix is a copy, so the environment is whichever source matches it.
      ENV_NAME:
        sh: |
          for file in shell.*.nix; do
            if cmp -s shell.nix "$file"; then
              name=${file#shell.}
              echo "${name%.nix}"
              exit 0
            fi
          done
          echo "unknown (shell.nix missing or edited, run task use:dev or use:prod)"
    cmds:
      - echo "Environment  {{.ENV_NAME}}"
      - printf '%s\n' "Database     ${MY_APP_DATABASE_URL:-<unset>}" | sed -E 's#://[^@/]*@#://***@#'

  # ----------------------------------------------------------------------------
  # Architecture Decision Records (ADR)
  # ----------------------------------------------------------------------------

  adr:new:
    desc: Create a new ADR interactively (usage - task adr:new -- "Short decision title")
    interactive: true
    cmds:
      - pnpm exec log4brains adr new {{.CLI_ARGS}}

  adr:preview:
    desc: Browse the ADR knowledge base locally with hot reload (http://localhost:4004)
    cmds:
      - pnpm exec log4brains preview {{.CLI_ARGS}}

  # ----------------------------------------------------------------------------
  # Git
  # ----------------------------------------------------------------------------

  clear-rr-cache:
    cmds:
      - rm -rf .git/rr-cache

  # ----------------------------------------------------------------------------
  # Release
  # ----------------------------------------------------------------------------

  version:bump:
    desc: "Bump project version without committing (default: patch). E.g. task version:bump -- minor"
    cmds:
      - pnpm run version:bump {{.CLI_ARGS | default "patch"}}
